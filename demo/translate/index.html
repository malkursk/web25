<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="container">

    <div class="m-3">
        <p id="text"></p>
        <div class="row">
            <span id="name"></span>
            <input id="inputName" class="form-control" type="text" value="" placeholder="Enter your name">
        </div>
        <div class="row">
            <span id="phone"></span>
            <input id="inputPhone" class="form-control" type="text" value="" placeholder="Enter your mobile phone">
        </div>
    </div>

    <button class="btn btn-success m-2" id="btn"></i></button>

    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>

</html>
