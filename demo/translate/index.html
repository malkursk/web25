<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body class="container">

    <div class="m-3">
        <p id="text"></p>
        <div class="row">
            <span id="name"></span>
            <input id="inputName" class="form-control" type="text" value="" placeholder="Enter your name">
        </div>
        <div class="row">
            <span id="phone"></span>
            <input id="inputPhone" class="form-control" type="text" value="" placeholder="Enter your mobile phone">
        </div>
    </div>

    <button class="btn btn-success m-2" id="btn"></i></button>

    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
    <script type="module">
        const btn = document.getElementById("btn");
        const output = (err, t) => {
            if (err) {
                return console.log("something went wrong loading", err);
            }
            document.getElementById("text").innerHTML = ' <i class="fa-regular fa-heart"></i> ' + t('text');
            document.getElementById("btn").innerHTML = " <i class='fa-solid fa-globe'></i> " + t("changeLang");
            document.getElementById("name").innerHTML = '<i class="fa-solid fa-user"></i> ' + t("name");
            document.getElementById("phone").innerHTML = '<i class="fa-solid fa-phone"></i> ' + t("phone");
            document.getElementById("inputName").placeholder = t("inputName");
            document.getElementById("inputPhone").placeholder = t("inputPhone");

        };

        i18next.init(
            {
                lng: "en",
                fallbackLng: ["en", "ru"],
                debug: true,
                resources: {
                    en: {
                        translation: {
                            text: "Welcome!",
                            name: "name:",
                            phone: "phone:",
                            inputName: "enter your name",
                            inputPhone: "enter your mobile",
                            changeLang: "change language",
                        },
                    },
                    ru: {
                        translation: {
                            text: "Добро пожаловать",
                            name: "имя:",
                            phone: "телефон:",
                            inputName: "введите Ваше имя",
                            inputPhone: "укажите Ваш телефон",
                            changeLang: "сменить язык",
                        },
                    },
                },
            },
            output
        );

        btn.onclick = () => {
            const lang = i18next.language === "en" ? "ru" : "en";
            i18next.changeLanguage(lang, output);
        };
    </script>
</body>

</html>
