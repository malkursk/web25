<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grades</title>
</head>
<body>
    <h1>Grades</h1>
    <table>
        <tr>
            <th>Subject</th>
            <th>Score</th>
            <th>Date</th>
        </tr>
        {% for grade in grades %}
        <tr>
            <td>{{ grade.subject }}</td>
            <td>{{ grade.score }}</td>
            <td>{{ grade.date }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
