{% extends "base.html" %}

{% block content %}
<h1>Games</h1>
<a href="{{ url_for('new_game') }}">Start a new game</a>
<ul>
    {% for game in games %}
        <li>
            <a href="{{ url_for('game', game_id=game.id) }}">Game #{{ game.id }}</a> -
            Status: {{ game.status }} {% if game.winner %} (Winner: {{ game.winner }}){% endif %}
        </li>
    {% endfor %}
</ul>
{% endblock %}
